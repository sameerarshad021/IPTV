<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Stream Hub | Sameer Arshad</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --gold: #f1c40f; --bg: #0b0b0b; --card: #1c1c1c; }
        body { margin: 0; display: flex; height: 100vh; background: var(--bg); color: #e0e0e0; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        #sidebar { width: 320px; background: #141414; display: flex; flex-direction: column; border-right: 1px solid #222; }
        .brand { padding: 25px; border-bottom: 1px solid #222; text-align: center; }
        .brand h2 { color: var(--gold); margin: 0; letter-spacing: 1px; font-size: 22px; }

        .controls { padding: 15px; background: #1a1a1a; border-bottom: 1px solid #222; display: flex; flex-direction: column; gap: 10px; }
        select, input { width: 100%; background: #222; color: white; border: 1px solid #444; padding: 10px; border-radius: 5px; outline: none; box-sizing: border-box; }
        input:focus { border-color: var(--gold); }

        #channel-list { flex: 1; overflow-y: auto; padding: 15px; scrollbar-width: thin; scrollbar-color: var(--gold) #141414; }
        .channel-item { 
            padding: 12px; margin-bottom: 10px; background: var(--card); border-radius: 8px; 
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 12px; border: 1px solid transparent;
        }
        .channel-item:hover { border-color: var(--gold); background: #252525; }
        .channel-item.active { border-color: var(--gold); background: #252525; box-shadow: 0 0 10px rgba(241, 196, 15, 0.2); }

        #main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .video-wrapper { width: 100%; max-width: 960px; background: #000; border-radius: 15px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        video { width: 100%; aspect-ratio: 16/9; display: block; }
        
        .loader { border: 4px solid #333; border-top: 4px solid var(--gold); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="brand">
        <h2>WORLD STREAM</h2>
        <p style="font-size: 11px; color: #666; margin: 5px 0 0;">Dev: Sameer Arshad (Full Stack)</p>
    </div>

    <div class="controls">
        <select id="playlist-select" onchange="fetchPlaylist(this.value)">
            <option value="https://raw.githubusercontent.com/joevess/IPTV/main/iptv.m3u">Joevess Stable (Auto-Update)</option>
            <option value="https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_pakistan.m3u">Pakistan (Free-TV)</option>
            <option value="https://iptv-org.github.io/iptv/categories/movies.m3u">Global Movies</option>
        </select>
        <input type="text" id="search-bar" placeholder="Search channels..." onkeyup="filterChannels()">
    </div>

    <div id="channel-list">Connecting...</div>
</div>

<div id="main">
    <div class="video-wrapper">
        <video id="video" controls autoplay playsinline crossorigin="anonymous"></video>
    </div>
    <div id="status-pill" style="margin-top:20px; color:var(--gold);">Select a channel</div>
</div>

<script>
    const video = document.getElementById('video');
    const channelList = document.getElementById('channel-list');
    const statusPill = document.getElementById('status-pill');
    let hls = new Hls();
    let allChannels = [];
    const proxy = "https://corsproxy.io/?";

    async function fetchPlaylist(url) {
        channelList.innerHTML = '<div style="text-align:center;"><div class="loader"></div><p>Fetching...</p></div>';
        try {
            const response = await fetch(proxy + encodeURIComponent(url));
            const data = await response.text();
            parseM3U(data);
        } catch (error) {
            channelList.innerHTML = '<p style="text-align:center; color:red;">Connection Failed. Use GitHub Pages.</p>';
        }
    }

    function parseM3U(data) {
        allChannels = [];
        const lines = data.split('\n');
        let current = {};
        lines.forEach(line => {
            line = line.trim();
            if (line.startsWith('#EXTINF')) {
                current.name = line.split(',')[1] || "Unknown";
            } else if (line.startsWith('http')) {
                current.url = line;
                allChannels.push({...current});
                current = {};
            }
        });
        renderChannels(allChannels);
    }

    function renderChannels(channels) {
        channelList.innerHTML = '';
        channels.forEach(ch => {
            const div = document.createElement('div');
            div.className = 'channel-item';
            div.innerHTML = `📺 <span>${ch.name}</span>`;
            div.onclick = () => play(ch.url, ch.name, div);
            channelList.appendChild(div);
        });
    }

    function filterChannels() {
        const query = document.getElementById('search-bar').value.toLowerCase();
        const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(query));
        renderChannels(filtered);
    }

    function play(url, name, el) {
        document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        statusPill.innerText = "Loading: " + name;

        if (Hls.isSupported()) {
            hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        }
    }

    fetchPlaylist(document.getElementById('playlist-select').value);
</script>
</body>
</html>
