<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Stream Hub | Sameer Arshad</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --gold: #f1c40f; --bg: #0b0b0b; --card: #1c1c1c; }
        body { margin: 0; display: flex; height: 100vh; background: var(--bg); color: #e0e0e0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        #sidebar { width: 350px; background: #141414; display: flex; flex-direction: column; border-right: 1px solid #222; }
        .brand { padding: 20px; border-bottom: 1px solid #222; text-align: center; }
        .brand h2 { color: var(--gold); margin: 0; font-size: 22px; letter-spacing: 2px; }

        .controls { padding: 15px; background: #1a1a1a; border-bottom: 1px solid #222; display: flex; flex-direction: column; gap: 10px; }
        select, input { width: 100%; background: #222; color: white; border: 1px solid #333; padding: 10px; border-radius: 5px; outline: none; }
        
        #channel-list { flex: 1; overflow-y: auto; padding: 15px; }
        .channel-item { 
            padding: 12px; margin-bottom: 8px; background: var(--card); border-radius: 8px; 
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 10px; border: 1px solid transparent;
        }
        .channel-item:hover { border-color: var(--gold); background: #252525; }
        .channel-item.active { border-color: var(--gold); background: #252525; border-left: 5px solid var(--gold); }

        #main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .video-wrapper { width: 100%; max-width: 900px; background: #000; border-radius: 15px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.9); }
        video { width: 100%; aspect-ratio: 16/9; display: block; }

        .loader { border: 3px solid #333; border-top: 3px solid var(--gold); border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; margin: auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="brand">
        <h2>WORLD STREAM</h2>
        <p style="font-size: 10px; color: #666;">DEV: SAMEER ARSHAD (FULL STACK)</p>
    </div>

    <div class="controls">
        <!-- Dynamic Category Selector -->
        <label style="font-size: 11px; color: #888;">SELECT GLOBAL SOURCE</label>
        <select id="playlist-select" onchange="fetchPlaylist(this.value)">
            <optgroup label="Stable Main Sources">
                <option value="https://raw.githubusercontent.com/joevess/IPTV/main/iptv.m3u">Joevess Stable (Recommended)</option>
                <option value="https://iptv-org.github.io/iptv/index.m3u">IPTV-ORG Master Index (Huge!)</option>
            </optgroup>
            <optgroup label="Categories">
                <option value="https://iptv-org.github.io/iptv/categories/movies.m3u">🎬 Movies</option>
                <option value="https://iptv-org.github.io/iptv/categories/sports.m3u">⚽ Sports</option>
                <option value="https://iptv-org.github.io/iptv/categories/news.m3u">📰 News</option>
                <option value="https://iptv-org.github.io/iptv/categories/music.m3u">🎵 Music</option>
                <option value="https://iptv-org.github.io/iptv/categories/kids.m3u">👶 Kids</option>
            </optgroup>
            <optgroup label="Countries">
                <option value="https://iptv-org.github.io/iptv/countries/pk.m3u">🇵🇰 Pakistan</option>
                <option value="https://iptv-org.github.io/iptv/countries/us.m3u">🇺🇸 USA</option>
                <option value="https://iptv-org.github.io/iptv/countries/uk.m3u">🇬🇧 UK</option>
                <option value="https://iptv-org.github.io/iptv/countries/in.m3u">🇮🇳 India</option>
            </optgroup>
        </select>
        <input type="text" id="search-bar" placeholder="Search in thousands of channels..." onkeyup="filterChannels()">
    </div>

    <div id="channel-list">
        <div style="text-align:center; padding:20px;"><div class="loader"></div><p>Fetching Data...</p></div>
    </div>
</div>

<div id="main">
    <div class="video-wrapper">
        <video id="video" controls autoplay playsinline crossorigin="anonymous"></video>
    </div>
    <div style="margin-top:20px; text-align:center;">
        <h3 id="current-name" style="color:var(--gold); margin:0;">Welcome Sameer</h3>
        <p id="status-text" style="font-size:12px; color:#666;">Select a source to begin your global streaming experience.</p>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const channelList = document.getElementById('channel-list');
    const statusText = document.getElementById('status-text');
    const nameDisplay = document.getElementById('current-name');
    let allChannels = [];
    let hls = new Hls();

    // CORS Proxy Fallback
    const proxy = "https://corsproxy.io/?";

    async function fetchPlaylist(url) {
        channelList.innerHTML = '<div style="text-align:center; padding:20px;"><div class="loader"></div><p>Connecting...</p></div>';
        try {
            const response = await fetch(proxy + encodeURIComponent(url));
            if (!response.ok) throw new Error();
            const data = await response.text();
            parseM3U(data);
        } catch (e) {
            channelList.innerHTML = '<p style="color:red; text-align:center; padding:20px;">Connection Failed.<br>Please use GitHub Pages or Live Server.</p>';
        }
    }

    function parseM3U(data) {
        allChannels = [];
        const lines = data.split('\n');
        let current = {};

        lines.forEach(line => {
            line = line.trim();
            if (line.startsWith('#EXTINF')) {
                current.name = line.split(',')[1] || "Unnamed Channel";
                // Logo extract (optional but makes it look pro)
                const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                current.logo = logoMatch ? logoMatch[1] : null;
            } else if (line.startsWith('http')) {
                current.url = line;
                allChannels.push({...current});
                current = {};
            }
        });
        renderChannels(allChannels);
    }

    function renderChannels(channels) {
        channelList.innerHTML = '';
        if (channels.length === 0) {
            channelList.innerHTML = '<p style="text-align:center;">No channels found.</p>';
            return;
        }
        channels.forEach(ch => {
            const div = document.createElement('div');
            div.className = 'channel-item';
            div.innerHTML = `<span>${ch.logo ? '<img src="'+ch.logo+'" width="20">' : '📺'}</span> <span>${ch.name}</span>`;
            div.onclick = () => playStream(ch.url, ch.name, div);
            channelList.appendChild(div);
        });
    }

    function filterChannels() {
        const query = document.getElementById('search-bar').value.toLowerCase();
        const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(query));
        renderChannels(filtered);
    }

    function playStream(url, name, element) {
        document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
        element.classList.add('active');
        nameDisplay.innerText = name;
        statusText.innerText = "Loading stream...";

        if (Hls.isSupported()) {
            hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play();
                statusText.innerText = "LIVE";
            });
            hls.on(Hls.Events.ERROR, () => {
                statusText.innerText = "Error: Stream Unavailable";
            });
        }
    }

    // Initial Load
    fetchPlaylist(document.getElementById('playlist-select').value);
</script>

</body>
</html>
