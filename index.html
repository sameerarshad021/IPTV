<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Stream Hub | Sameer Arshad</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --gold: #f1c40f; --bg: #0b0b0b; --card: #1c1c1c; }
        body { margin: 0; display: flex; height: 100vh; background: var(--bg); color: #e0e0e0; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        /* Sidebar */
        #sidebar { width: 320px; background: #141414; display: flex; flex-direction: column; border-right: 1px solid #222; }
        .brand { padding: 25px; border-bottom: 1px solid #222; text-align: center; }
        .brand h2 { color: var(--gold); margin: 0; letter-spacing: 1px; font-size: 22px; }
        .brand p { font-size: 11px; color: #666; margin-top: 5px; }

        /* Custom Dropdown / Filter */
        .source-selector { padding: 15px; background: #1a1a1a; border-bottom: 1px solid #222; }
        select { width: 100%; background: #222; color: white; border: 1px solid var(--gold); padding: 8px; border-radius: 5px; cursor: pointer; outline: none; }

        #channel-list { flex: 1; overflow-y: auto; padding: 15px; scrollbar-width: thin; scrollbar-color: var(--gold) #141414; }
        .channel-item { 
            padding: 12px; margin-bottom: 10px; background: var(--card); border-radius: 8px; 
            cursor: pointer; transition: all 0.3s ease; border: 1px solid transparent; display: flex; align-items: center; gap: 12px;
        }
        .channel-item:hover { background: #252525; border-color: var(--gold); transform: scale(1.02); }
        .channel-item.active { border-color: var(--gold); background: #252525; box-shadow: 0 0 10px rgba(241, 196, 15, 0.2); }

        /* Main Player Area */
        #main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; }
        .video-wrapper { width: 100%; max-width: 960px; position: relative; background: #000; border-radius: 15px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        video { width: 100%; aspect-ratio: 16/9; display: block; }
        
        .player-info { margin-top: 25px; text-align: center; }
        #current-name { font-size: 24px; color: var(--gold); margin: 0; font-weight: 600; }
        #status-pill { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; background: #333; margin-top: 10px; color: #888; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="brand">
        <h2>WORLD STREAM</h2>
        <p>Dev: Sameer Arshad (Full Stack)</p>
    </div>

    <div class="source-selector">
        <label style="font-size: 11px; color: #888; display: block; margin-bottom: 5px;">SELECT PLAYLIST SOURCE</label>
        <select id="playlist-select" onchange="fetchPlaylist(this.value)">
            <option value="https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_pakistan.m3u">🇵🇰 Pakistan (Free-TV)</option>
            <option value="https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_united_states.m3u">🇺🇸 USA (Free-TV)</option>
            <option value="https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_uk.m3u">🇬🇧 United Kingdom</option>
            <option value="https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_india.m3u">🇮🇳 India</option>
            <option value="https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_germany.m3u">🇩🇪 Germany</option>
            <option value="https://iptv-org.github.io/iptv/categories/movies.m3u">🎬 Global Movies</option>
            <option value="https://iptv-org.github.io/iptv/categories/sports.m3u">⚽ Global Sports</option>
            <option value="https://iptv-org.github.io/iptv/categories/documentary.m3u">🌍 Documentaries</option>
        </select>
    </div>

    <div id="channel-list">Loading Channels...</div>
</div>

<div id="main">
    <div class="video-wrapper">
        <video id="video" controls autoplay playsinline crossorigin="anonymous"></video>
    </div>
    <div class="player-info">
        <h1 id="current-name">Welcome to Stream Hub</h1>
        <div id="status-pill">Select a channel to start live streaming</div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const channelList = document.getElementById('channel-list');
    const statusPill = document.getElementById('status-pill');
    const nameDisplay = document.getElementById('current-name');
    let hls = new Hls();

    // CORS Proxy to bypass GitHub/Stream blocks
    const proxy = "https://api.allorigins.win/raw?url=";

    async function fetchPlaylist(url) {
        channelList.innerHTML = '<p style="text-align:center; padding:20px;">Fetching global streams...</p>';
        try {
            const response = await fetch(proxy + encodeURIComponent(url));
            const data = await response.text();
            parseM3U(data);
        } catch (error) {
            channelList.innerHTML = '<p style="color:#e74c3c; text-align:center;">Failed to fetch. Try enabling CORS extension.</p>';
        }
    }

    function parseM3U(data) {
        channelList.innerHTML = '';
        const lines = data.split('\n');
        let currentChannel = {};

        lines.forEach(line => {
            line = line.trim();
            if (line.startsWith('#EXTINF')) {
                // Extracting name from #EXTINF line
                const parts = line.split(',');
                currentChannel.name = parts[parts.length - 1] || "Unknown Channel";
            } else if (line.startsWith('http')) {
                currentChannel.url = line;
                addChannelToList(currentChannel.name, currentChannel.url);
                currentChannel = {}; // Reset for next
            }
        });
    }

    function addChannelToList(name, url) {
        const item = document.createElement('div');
        item.className = 'channel-item';
        item.innerHTML = `<span>📺</span> <span style="font-size:13px; font-weight:500;">${name}</span>`;
        item.onclick = () => {
            // UI Active State
            document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            playStream(url, name);
        };
        channelList.appendChild(item);
    }

    function playStream(url, name) {
        nameDisplay.innerText = name;
        statusPill.innerText = "Attempting to Connect...";
        statusPill.style.color = "#f1c40f";

        if (Hls.isSupported()) {
            hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play();
                statusPill.innerText = "LIVE NOW";
                statusPill.style.color = "#2ecc71";
            });
            hls.on(Hls.Events.ERROR, (event, data) => {
                if(data.fatal) {
                    statusPill.innerText = "STREAM OFFLINE / BLOCKED";
                    statusPill.style.color = "#e74c3c";
                }
            });
        }
    }

    // Initial Load
    fetchPlaylist(document.getElementById('playlist-select').value);
</script>

</body>
</html>
