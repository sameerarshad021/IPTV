<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Stream Hub | Sameer Arshad</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --gold: #f1c40f; --bg: #0b0b0b; --card: #1c1c1c; --text: #e0e0e0; }
        body { margin: 0; display: flex; height: 100vh; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        #sidebar { width: 350px; background: #141414; display: flex; flex-direction: column; border-right: 1px solid #222; }
        .brand { padding: 20px; border-bottom: 1px solid #222; text-align: center; }
        .brand h2 { color: var(--gold); margin: 0; font-size: 22px; letter-spacing: 2px; text-transform: uppercase; }

        .controls { padding: 15px; background: #1a1a1a; border-bottom: 1px solid #222; display: flex; flex-direction: column; gap: 10px; }
        select, input { width: 100%; background: #222; color: white; border: 1px solid #333; padding: 12px; border-radius: 5px; outline: none; font-size: 14px; }
        
        #channel-list { flex: 1; overflow-y: auto; padding: 15px; }
        .channel-item { 
            padding: 12px; margin-bottom: 8px; background: var(--card); border-radius: 8px; 
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 12px; border: 1px solid transparent;
        }
        .channel-item:hover { border-color: var(--gold); background: #252525; }
        .channel-item.active { border-color: var(--gold); background: #252525; border-left: 5px solid var(--gold); }
        .channel-item img { width: 30px; height: 30px; object-fit: contain; border-radius: 4px; }

        #main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(circle at center, #1a1a1a 0%, #0b0b0b 100%); }
        .video-wrapper { width: 100%; max-width: 950px; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 1px solid #333; }
        video { width: 100%; aspect-ratio: 16/9; display: block; }

        .loader { border: 3px solid #333; border-top: 3px solid var(--gold); border-radius: 50%; width: 25px; height: 25px; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .error-msg { color: #ff4757; text-align: center; padding: 20px; font-size: 14px; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="brand">
        <h2>WORLD STREAM</h2>
        <p style="font-size: 10px; color: #666; margin-top: 5px;">MERN STACK DEVELOPER EDITION</p>
    </div>

    <div class="controls">
        <select id="playlist-select" onchange="fetchPlaylist(this.value)">
            <optgroup label="Primary Sources (Recommended)">
                <option value="https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_pakistan.m3u">🇵🇰 Pakistan Stable</option>
                <option value="https://raw.githubusercontent.com/joevess/IPTV/main/iptv.m3u">🌍 Global All-in-One</option>
            </optgroup>
            <optgroup label="Categories">
                <option value="https://iptv-org.github.io/iptv/categories/movies.m3u">🎬 Movies</option>
                <option value="https://iptv-org.github.io/iptv/categories/sports.m3u">⚽ Sports</option>
                <option value="https://iptv-org.github.io/iptv/categories/news.m3u">📰 News</option>
            </optgroup>
            <optgroup label="Other Sources">
                <option value="https://raw.githubusercontent.com/wcb1969/iptv/main/playlist.m3u">🇨🇳 Chinese/Global Mix</option>
            </optgroup>
        </select>
        <input type="text" id="search-bar" placeholder="Search channels..." onkeyup="filterChannels()">
    </div>

    <div id="channel-list"></div>
</div>

<div id="main">
    <div class="video-wrapper">
        <video id="video" controls autoplay playsinline crossorigin="anonymous"></video>
    </div>
    <div style="margin-top:25px; text-align:center;">
        <h3 id="current-name" style="color:var(--gold); margin:0; font-weight: 500;">Welcome, Sameer Arshad</h3>
        <p id="status-text" style="font-size:13px; color:#888; margin-top:5px;">Select a channel to start streaming.</p>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const channelList = document.getElementById('channel-list');
    const statusText = document.getElementById('status-text');
    const nameDisplay = document.getElementById('current-name');
    let allChannels = [];
    let hls = new Hls();

    // Multi-Proxy Fallback System
    async function fetchPlaylist(url) {
        channelList.innerHTML = '<div style="text-align:center; padding:20px;"><div class="loader"></div><p>Fetching Stream Data...</p></div>';
        
        const proxies = [
            `https://api.allorigins.win/raw?url=`,
            `https://corsproxy.io/?`
        ];

        let rawData = null;
        let usedProxy = "";

        for (let proxy of proxies) {
            try {
                const response = await fetch(proxy + encodeURIComponent(url));
                if (response.ok) {
                    rawData = await response.text();
                    if (rawData.includes("#EXTM3U")) {
                        usedProxy = proxy;
                        break; 
                    }
                }
            } catch (e) { console.warn("Proxy switch triggered..."); }
        }

        if (rawData) {
            parseM3U(rawData);
        } else {
            channelList.innerHTML = `
                <div class="error-msg">
                    <strong>Connection Failed</strong><br>
                    1. Turn ON "Allow CORS" Extension<br>
                    2. Check Internet Connection
                </div>`;
        }
    }

    function parseM3U(data) {
        allChannels = [];
        const lines = data.split('\n');
        let current = {};

        lines.forEach(line => {
            line = line.trim();
            if (line.startsWith('#EXTINF')) {
                const namePart = line.split(',')[1];
                current.name = namePart ? namePart.trim() : "Unknown Channel";
                const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                current.logo = logoMatch ? logoMatch[1] : null;
            } else if (line.startsWith('http')) {
                current.url = line;
                allChannels.push({...current});
                current = {};
            }
        });
        renderChannels(allChannels);
    }

    function renderChannels(channels) {
        channelList.innerHTML = '';
        if (channels.length === 0) {
            channelList.innerHTML = '<p style="text-align:center; padding:20px;">No channels found.</p>';
            return;
        }
        channels.forEach(ch => {
            const div = document.createElement('div');
            div.className = 'channel-item';
            const icon = ch.logo ? `<img src="${ch.logo}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/716/716429.png'">` : '📺';
            div.innerHTML = `${icon} <span>${ch.name}</span>`;
            div.onclick = () => playStream(ch.url, ch.name, div);
            channelList.appendChild(div);
        });
    }

    function filterChannels() {
        const query = document.getElementById('search-bar').value.toLowerCase();
        const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(query));
        renderChannels(filtered);
    }

    function playStream(url, name, element) {
        document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
        element.classList.add('active');
        nameDisplay.innerText = name;
        statusText.innerText = "Connecting to Secure Stream...";

        if (Hls.isSupported()) {
            hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play();
                statusText.innerText = "● LIVE";
                statusText.style.color = "#2ecc71";
            });
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    statusText.innerText = "Stream Offline or Geo-Blocked";
                    statusText.style.color = "#ff4757";
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play();
        }
    }

    // Initial load
    fetchPlaylist(document.getElementById('playlist-select').value);
</script>

</body>
</html>
